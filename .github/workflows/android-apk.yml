name: Build Android APK

on:
  push:
    branches: [main, ccr-95992d41-q53y58]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Prepare Android project
        run: |
          npm run build:www
          # stamp the build number so the app can tell when a newer APK is released
          V=$(tr -d ' \n\r' < version.txt)
          sed -i "s/const APP_BUILD=0;/const APP_BUILD=${{ github.run_number }};/; s/const APP_VERSION='dev';/const APP_VERSION='$V';/" www/index.html
          grep -c "const APP_VERSION='$V';" www/index.html
          grep -c "const APP_BUILD=${{ github.run_number }};" www/index.html
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          # allow the app to open the system installer for in-app updates
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -c REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          # every build gets a higher version so it installs over the previous one
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$(tr -d ' \n\r' < version.txt)\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        run: |
          # sign every build with the committed key, so each APK installs as an update over the last one
          KS="$GITHUB_WORKSPACE/android-signing/debug.keystore"
          sed -i "0,/^android {/s##android {\n    signingConfigs {\n        release {\n            storeFile file('$KS')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }#" android/app/build.gradle
          # release build (not debuggable), signed with the same key
          sed -i "s#minifyEnabled false#minifyEnabled false\n            signingConfig signingConfigs.release#" android/app/build.gradle
          sed -n '1,40p' android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Sunnah.apk

      - name: Verify APK signing key
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Sunnah.apk | tee certs.txt
          grep -qi "SHA-256 digest: 0c0c71170b496c0fb22e7be0c5ab0465afdde97d5b0335575b5d13aa6239dd13" certs.txt || { echo "APK is not signed with android-signing/debug.keystore"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Sunnah-apk
          path: Sunnah.apk

      - name: Publish download link (GitHub Release "apk")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Sunnah.apk \
            --target "$GITHUB_SHA" \
            --title "Sunnah v$(tr -d ' \n\r' < version.txt) - Android APK (build ${{ github.run_number }})" \
            --notes "Download Sunnah.apk on your Android phone and open it to install. Built from ${GITHUB_SHA::7}."
